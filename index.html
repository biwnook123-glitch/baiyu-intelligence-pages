<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#233c4b">
<meta name="description" content="每日重点、完整简报与持续观察。"><title>情报中枢 · 每日阅读</title>
<link rel="stylesheet" href="reader.css"></head><body>
<a class="skip" href="#main">跳到内容</a>
<aside class="sidebar">
<a href="#today" class="brand"><span class="brand-mark">情</span><span>情报中枢<small>你的每日阅读</small></span></a>
<nav aria-label="主导航" id="nav">
<button data-view="today" class="active"><span>今日精选</span><span aria-hidden="true">↗</span></button>
<button data-view="briefs"><span>简报档案</span><span id="archiveCount"></span></button>
<button data-view="saved"><span>稍后阅读</span><span id="savedCount"></span></button>
<button data-view="watchlist"><span>持续关注</span><span id="followCount"></span></button></nav>
<div class="channel-nav"><p class="label">关注的领域</p><div id="channelNav"></div></div>
<div class="sidebar-bottom"><span class="edition-dot"></span><span id="editionLabel">载入简报中</span><small>每日 05:00 开始更新</small></div></aside>
<main id="main">
<header class="topbar"><div class="breadcrumb">情报中枢 <span>/</span> <b id="viewLabel">今日精选</b></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索全部简报与事件" aria-label="搜索全部简报与事件"><kbd>Ctrl K</kbd></label></header>
<div id="freshness" class="freshness" role="status"></div><div id="content"></div>
<footer class="footer"><span>看见变化，留下判断。</span><button id="refresh">检查更新 ↻</button><span id="syncState"></span></footer></main>
<dialog id="reader" aria-labelledby="readerTitle"><div class="reader-toolbar"><span id="readerLabel"></span><button id="closeReader" aria-label="关闭阅读">关闭 ×</button></div><div id="readerBody" class="reader-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><noscript>请开启浏览器 JavaScript 以阅读情报中枢。</noscript>
<script src="data/feed.js"></script><script src="app.js"></script></body></html>
